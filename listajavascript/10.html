<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <style>
        button {
            width: 50px;
            height: 40px;
        }
    </style>
</head>
<body>
    <h1>Calculadora</h1>

    <input type="text" id="visor" value="0" readonly>
    <br><br>

    <button onclick="operador('+')">+</button>
    <button onclick="operador('-')">-</button>
    <button onclick="operador('*')">×</button>
    <button onclick="operador('/')">÷</button>
    <br>
    <button onclick="numero('7')">7</button>
    <button onclick="numero('8')">8</button>
    <button onclick="numero('9')">9</button>
    <br>
    <button onclick="numero('4')">4</button>
    <button onclick="numero('5')">5</button>
    <button onclick="numero('6')">6</button>
    <br>
    <button onclick="numero('1')">1</button>
    <button onclick="numero('2')">2</button>
    <button onclick="numero('3')">3</button>
    <br>
    <button onclick="numero('0')">0</button>
    <button onclick="numero('.')">.</button>
    <button onclick="limpar()">AC</button>
    <button onclick="calcular()">=</button>

    <script>
        let num1 = "";
        let num2 = "";
        let op = "";

        function numero(n) {
            if (op == "") {
                num1 = num1 + n;
                document.getElementById("visor").value = num1;
            } else {
                num2 = num2 + n;
                document.getElementById("visor").value = num2;
            }
        }

        function operador(o) {
            op = o;
        }

        function calcular() {
            let a = parseFloat(num1);
            let b = parseFloat(num2);
            let resultado = 0;

            if (op == "+") {
                resultado = a + b;
            } else if (op == "-") {
                resultado = a - b;
            } else if (op == "*") {
                resultado = a * b;
            } else if (op == "/") {
                resultado = a / b;
            }

            document.getElementById("visor").value = resultado;
            num1 = resultado;
            num2 = "";
            op = "";
        }

        function limpar() {
            num1 = "";
            num2 = "";
            op = "";
            document.getElementById("visor").value = 0;
        }
    </script>
</body>
</html>
