<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Números Primos</title>
</head>
<body>

    <h1 id="titulo">Números Primos em um Intervalo</h1>

    <label for="inicio">Início:</label>
    <input type="number" id="inicio">

    <label for="fim">Fim:</label>
    <input type="number" id="fim">

    <button id="botao">Verificar</button>

    <div id="resultadoPrimos"></div>

    <script>
        function ehPrimo(n) {
            if (n < 2) {
                return false;
            }

            for (let i = 2; i * i <= n; i++) {
                if (n % i == 0) {
                    return false;
                }
            }

            return true;
        }

        function verificar() {
            let inicio = parseInt(document.getElementById("inicio").value);
            let fim = parseInt(document.getElementById("fim").value);

            if (isNaN(inicio) || isNaN(fim)) {
                document.getElementById("resultadoPrimos").innerText = "Preencha os dois campos!";
                return;
            }

            if (inicio > fim) {
                let aux = inicio;
                inicio = fim;
                fim = aux;
            }

            let primos = [];

            for (let i = inicio; i <= fim; i++) {
                if (ehPrimo(i)) {
                    primos.push(i);
                }
            }

            if (primos.length == 0) {
                document.getElementById("resultadoPrimos").innerText = "Nenhum primo entre " + inicio + " e " + fim;
            } else {
                document.getElementById("resultadoPrimos").innerText = "Primos entre " + inicio + " e " + fim + ": " + primos.join(", ");
            }
        }

        document.getElementById("botao").addEventListener("click", verificar);
    </script>

</body>
</html>
