<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teclas</title>
</head>
<body>
    <h1>Captura de Teclas do Teclado</h1>
    <div id="saida"></div>

    <script>
        document.addEventListener("keydown", function(e) {
            document.getElementById("saida").innerHTML += e.key + " ";
            console.log(e.key);
        });
    </script>
</body>
</html>
