<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sorteio de Números</title>
</head>
<body>

    <h1 id="titulo">Sorteio de Números</h1>

    <label for="min">Mínimo:</label>
    <input type="number" id="min" value="1">

    <label for="max">Máximo:</label>
    <input type="number" id="max" value="100">

    <button id="botao">Sortear</button>

    <p id="resultado"></p>

    <ul id="lista"></ul>

    <script>
        let sorteados = [];

        function sortear() {
            let min = Number(document.getElementById("min").value);
            let max = Number(document.getElementById("max").value);

            let numero = Math.floor(Math.random() * (max - min + 1)) + min;

            document.getElementById("resultado").innerHTML = "Número sorteado: " + numero;

            let achou = false;

            for (let i = 0; i < sorteados.length; i++) {
                if (sorteados[i].numero == numero) {
                    sorteados[i].vezes++;
                    achou = true;
                }
            }

            if (achou == false) {
                sorteados.push({ numero: numero, vezes: 1 });
            }

            let texto = "";

            for (let i = 0; i < sorteados.length; i++) {
                texto += "<li>" + sorteados[i].numero + " - sorteado " + sorteados[i].vezes + " vez(es)</li>";
            }

            document.getElementById("lista").innerHTML = texto;
        }

        document.getElementById("botao").addEventListener("click", sortear);
    </script>

</body>
</html>
