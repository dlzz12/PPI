<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        :root{
            font-size: 10px;
        }
        body{
            height: 100vh;
        }
        p{font-size: 3rem;
            animation: lancamento 3s ease-in-out infinite;
        }
        @keyframes lancamento{
            0%{
                transform: translate(100vh)rotate(-45deg)
            }
            50%{
                transform: translate(50vh)rotate(-45deg)
            }
            100%{
                transform: translate(-100vh)rotate(-45deg)
            }
        }
    </style>
</head>
<body>
    <p>⚽</p>
</body>
</html>
