<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


    <style>

            
        
        .container{
          display: grid;
         height: 100vh;
        }
        .box{
            border: 1px solid black;
        }
        @media screen and (max-with: 400px) {
            .container {
                grid-template-columns: 1fr;

            }
        }

        @media screen and (min-width: 401px) and (max-width:800px) {
            .container{
                grid-template-columns: 1fr 1fr;
            }
        }
        

    </style>
<body>

    <div class="container">
        <div class="box" id="box-1">box</div>
        <div class="box" id="box-2">box</div>
        <div class="box" id="box-3">box</div>
        <div class="box" id="box-4">box</div>
        <div class="box" id="box-5">box</div>
        <div class="box" id="box-6">box</div>
        <div class="box" id="box-7">box</div>
        <div class="box" id="box-8">box</div>
        <div class="box" id="box-9">box</div>
    </div>
    </div>
</body>
</html>
