<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Cards</title>
<style>
.container {
  display: flex;
  height: 250px;
}
.card {
  width: 40px;
  margin: 5px;
  border-radius: 30px;
  background-size: cover;
  display: flex;
  align-items: flex-end;
  padding: 10px;
  color: white;
  font-family: Arial;
}
.grande {
  width: 300px;
}
.icone {
  background: white;
  width: 25px;
  height: 25px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-right: 10px;
}
</style>
</head>
<body>

<div class="container">
  <div class="card" style="background-image: url(https://picsum.photos/200/300?1);">
    <div class="icone">🚶</div>
  </div>

  <div class="card grande" style="background-image: url(https://picsum.photos/400/300?2);">
    <div class="icone">❄️</div>
    <div>
      <b>Oretemauw</b><br>
      Omuke trughte a otufta
    </div>
  </div>

  <div class="card" style="background-image: url(https://picsum.photos/200/300?3);">
    <div class="icone">🔔</div>
  </div>

  <div class="card" style="background-image: url(https://picsum.photos/200/300?4);">
    <div class="icone">💧</div>
  </div>

  <div class="card" style="background-image: url(https://picsum.photos/200/300?5);">
    <div class="icone">⚙️</div>
  </div>
</div>

</body>
</html>
