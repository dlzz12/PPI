<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
<style>
.tela {
  width: 200px;
  height: 340px;
  border: 3px solid purple;
  border-radius: 5px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
}
.logo {
  color: gray;
  font-size: 12px;
}
.barra {
  width: 170px;
  height: 15px;
  background: lightgray;
  margin-top: 10px;
}
.bola {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: lightgray;
}
.botao {
  width: 70px;
  height: 15px;
  background: lightgray;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="tela">
  <div>
    <p class="logo">Company Logo</p>
    <div class="barra"></div>
    <div class="barra"></div>
    <div class="barra"></div>
    <div class="barra"></div>
  </div>

  <div>
    <div class="bola"></div>
    <div class="botao"></div>
  </div>
</div>

</body>
</html>
