<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Layout</title>
<style>
header, footer {
  background: yellowgreen;
  height: 80px;
  padding: 10px;
}
.meio {
  display: flex;
  height: 250px;
}
article {
  flex: 3;
  padding: 10px;
}
aside {
  flex: 1;
  background: beige;
  padding: 10px;
}
nav {
  flex: 1;
  background: lightgreen;
  padding: 10px;
}
</style>
</head>
<body>

<header>Header</header>

<div class="meio">
  <article>Article</article>
  <aside>Aside</aside>
  <nav>Nav</nav>
</div>

<footer>Footer</footer>

</body>
</html>
