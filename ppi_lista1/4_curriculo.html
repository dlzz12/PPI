<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contato</title>
</head>

<body>

    <!-- Autor: Guilherme de Liz. Data de criacao: 28/09/2026 -->

    <p>Preencha os campos abaixo para entrar em contato.</p>

    <form>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>

        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" placeholder="Digite o assunto">

        <label for="estado">Estado:</label>
        <select id="estado">
            <option>Santa Catarina</option>
            <option>Parana</option>
            <option>Rio Grande do Sul</option>
            <option>Sao Paulo</option>
        </select>

        <label for="mensagem">Mensagem:</label>
        <input type="text" id="mensagem" placeholder="Digite sua mensagem">

        <input type="submit" value="Enviar">

    </form>

    <a href="3_tabela_uf.html">Voltar para o curriculo</a>

</body>
</html>
