<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    }
</style>

        <tr>

        <tr>
            <td>Rio Grande do Sul </td>

        </tr>
        <tr>
            <td>Amazonas</td>
            <td>AM</td>
            <td>Manaus</td>
        </tr>
        <tr>
            <td>Sao Paulo</td>
            <td>SP</td>
            <td>Sao Paulo</td>
        </tr>
        <tr>
            <td>Parana</td>

    </table>
</body>

</html>
