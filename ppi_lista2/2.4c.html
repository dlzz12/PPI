<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
.caixa {
  position: relative;
  width: 400px;
  height: 400px;
  border: 1px solid lightblue;
}
.box {
  position: absolute;
  width: 80px;
  height: 80px;
  font-size: 10px;
}
</style>

<body>
<div class="caixa">
  <div class="box" style="background: red; top: 0; left: 0;">box1</div>
  <div class="box" style="background: yellow; top: 0; right: 0;">box2</div>
  <div class="box" style="background: magenta; top: 160px; left: 160px;">box3</div>
  <div class="box" style="background: blue; bottom: 0; left: 0;">box4</div>
  <div class="box" style="background: green; bottom: 0; right: 0;">box5</div>
</div>
</body>

</html>
